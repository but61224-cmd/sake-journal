<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>清酒手帖 | Sake Journal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sake: {
                            bg: '#FDFBF7',      /* 溫潤米白 */
                            card: '#F3EFE6',    /* 柔和燕麥色 */
                            accent: '#8C9A84',  /* 沉穩清茶綠 */
                            terracotta: '#C88A65', /* 溫暖陶土橘 */
                            dark: '#2C2A29',    /* 深石墨黑字體 */
                            muted: '#7A7572'    /* 灰褐輔助字體 */
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Serif TC', sans-serif;
            background-color: #FDFBF7;
            color: #2C2A29;
            -webkit-tap-highlight-color: transparent;
        }
        /* 隱藏滾動條但保持滑動功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 4:3 比例直式預覽框 */
        .aspect-3-4 {
            aspect-ratio: 3 / 4;
        }

        /* 掃描線動畫 */
        @keyframes scan {
            0% { top: 0%; opacity: 0.8; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0.8; }
        }
        .scanning-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #C88A65;
            box-shadow: 0 0 10px #C88A65;
            animation: scan 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-sake-bg text-sake-dark min-h-screen pb-24">
