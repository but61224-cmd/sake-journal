<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>清酒手帖 | Sake Journal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sake: {
                            bg: '#FDFBF7',      /* 溫潤米白 */
                            card: '#F3EFE6',    /* 柔和燕麥色 */
                            accent: '#8C9A84',  /* 沉穩清茶綠 */
                            terracotta: '#C88A65', /* 溫暖陶土橘 */
                            dark: '#2C2A29',    /* 深石墨黑字體 */
                            muted: '#7A7572'    /* 灰褐輔助字體 */
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Serif TC', sans-serif;
            background-color: #FDFBF7;
            color: #2C2A29;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 4:3 比例直式預覽框 */
        .aspect-3-4 {
            aspect-ratio: 3 / 4;
        }

        /* 掃描線動畫 */
        @keyframes scan {
            0% { top: 0%; opacity: 0.8; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0.8; }
        }
        .scanning-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #C88A65;
            box-shadow: 0 0 10px #C88A65;
            animation: scan 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-sake-bg text-sake-dark min-h-screen pb-24">

    <!-- 頂部導航列 -->
    <header class="sticky top-0 z-40 bg-sake-bg/90 backdrop-blur-md border-b border-[#EAE3D2] px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-serif font-semibold tracking-wider">清酒手帖</h1>
            <p class="text-xs text-sake-muted">Sake Tasting Journal</p>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="openSettingsModal()" class="w-9 h-9 rounded-full bg-sake-card flex items-center justify-center text-sake-dark hover:bg-[#E5DFD3] transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto px-4 pt-4">
        
        <!-- 搜尋與篩選區 -->
        <div class="mb-5 space-y-3">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-sake-muted">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="searchInput" oninput="filterSakes()" placeholder="搜尋酒名、酒造、地點或筆記..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-sake-card border border-[#EAE3D2] rounded-2xl text-sm focus:outline-none focus:ring-1 focus:ring-sake-terracotta placeholder-sake-muted/70">
            </div>

            <!-- 分類標籤篩選 -->
            <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1 text-xs" id="categoryFilters">
                <button onclick="setCategoryFilter('all')" class="category-btn px-3.5 py-1.5 rounded-full bg-sake-dark text-white font-medium whitespace-nowrap transition">全部</button>
                <button onclick="setCategoryFilter('純米大吟釀')" class="category-btn px-3.5 py-1.5 rounded-full bg-sake-card text-sake-muted whitespace-nowrap transition">純米大吟釀</button>
                <button onclick="setCategoryFilter('純米吟釀')" class="category-btn px-3.5 py-1.5 rounded-full bg-sake-card text-sake-muted whitespace-nowrap transition">純米吟釀</button>
                <button onclick="setCategoryFilter('特別純米')" class="category-btn px-3.5 py-1.5 rounded-full bg-sake-card text-sake-muted whitespace-nowrap transition">特別純米</button>
                <button onclick="setCategoryFilter('生酒')" class="category-btn px-3.5 py-1.5 rounded-full bg-sake-card text-sake-muted whitespace-nowrap transition">生酒</button>
            </div>
        </div>

        <!-- 清單卡片區 -->
        <div id="sakeList" class="space-y-4">
            <!-- 動態渲染清單 -->
        </div>

        <!-- 查無資料提示 -->
        <div id="emptyState" class="hidden text-center py-12">
            <p class="text-sake-muted text-sm">目前沒有找到符合的清酒紀錄</p>
        </div>
    </main>

    <!-- 底部懸浮拍照按鈕 (FAB) -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center z-30 pointer-events-none">
        <button onclick="openAddModal()" class="pointer-events-auto bg-sake-dark text-sake-bg hover:bg-black px-6 py-3.5 rounded-full shadow-lg flex items-center space-x-2 transition transform active:scale-95">
            <svg class="w-5 h-5 text-sake-terracotta" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="font-medium text-sm tracking-wide">拍照記錄清酒</span>
        </button>
    </div>

    <!-- 新增/辨識 Modal -->
    <div id="addModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-sake-bg w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col">
            
            <!-- Modal 標題 -->
            <div class="px-6 py-4 border-b border-[#EAE3D2] flex justify-between items-center sticky top-0 bg-sake-bg z-10">
                <h3 class="font-serif font-semibold text-base">新增清酒記錄</h3>
                <button onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-sake-card flex items-center justify-center text-sake-muted hover:text-sake-dark">✕</button>
            </div>

            <div class="p-6 space-y-5">
                
                <!-- 4:3 直式拍照/上傳區 (支援相機與相簿選擇) -->
                <div>
                    <label class="block text-xs font-medium text-sake-muted mb-2">酒標照片 (4:3 比例)</label>
                    
                    <!-- 拍照與相簿選擇按鈕列 -->
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <button type="button" onclick="triggerCamera()" class="py-2 px-3 bg-sake-card hover:bg-[#E5DFD3] border border-[#EAE3D2] rounded-xl text-xs font-medium flex items-center justify-center space-x-1.5 transition">
                            <svg class="w-4 h-4 text-sake-terracotta" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                            <span>直接拍照</span>
                        </button>
                        <button type="button" onclick="triggerGallery()" class="py-2 px-3 bg-sake-card hover:bg-[#E5DFD3] border border-[#EAE3D2] rounded
